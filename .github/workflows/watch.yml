name: Kennzeichen-Wächter

# Prueft, ob in Muenster oder Luedinghausen ein kurzes Kennzeichen frei
# geworden ist, und schickt bei Aenderung eine Push-Meldung.
#
# Zeiten sind UTC, im Sommer also eine Stunde vor deutscher Zeit.
# Kennzeichen werden frei, wenn jemand ein Fahrzeug abmeldet - das laeuft ueber
# die Zulassungsstelle und damit werktags zu Bueroezeiten. Deshalb tagsueber
# alle 30 Minuten und am Wochenende nur einmal, statt rund um die Uhr Anfragen
# gegen ein Behoerdenportal zu schicken, wo ohnehin nichts passieren kann.
#
# Kuerzer als 5 Minuten laesst GitHub nicht zu, und geplante Laeufe starten
# unter Last regelmaessig einige Minuten spaeter - manche fallen ganz aus.
# Der Zeitplan ist also eine Obergrenze, keine Zusage.
on:
  schedule:
    - cron: '*/30 6-16 * * 1-5'   # Mo-Fr, 08:00-18:00 deutscher Zeit
    - cron: '0 10 * * 6,0'        # Sa+So einmal mittags
    - cron: '0 18 * * *'          # taeglich 20:00 deutscher Zeit: Tagesbericht
  workflow_dispatch:              # Knopf zum manuellen Ausloesen
    inputs:
      test_push:
        description: 'Test-Meldung ans Handy schicken (prueft die ganze Kette)'
        type: boolean
        default: false
      digest:
        description: 'Tagesbericht schicken, auch wenn sich nichts geaendert hat'
        type: boolean
        default: false

# Der Lauf schreibt den erkannten Stand zurueck ins Repo.
permissions:
  contents: write

# Zwei gleichzeitige Laeufe wuerden sich beim Zurueckschreiben in die Quere
# kommen und das Portal doppelt belasten.
concurrency:
  group: kennzeichen-watch
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci --omit=dev

      # Bei rund 20 Laeufen am Tag lohnt sich der Zwischenspeicher: Chromium
      # sind gut 100 MB, die sonst jedes Mal neu geladen wuerden.
      - name: Chromium aus dem Zwischenspeicher
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Auf dem Runner gibt es kein Chrome, also Playwrights eigenes Chromium.
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      # Ohne Secret laeuft alles gruen durch, es kaeme nur nie eine Meldung an.
      # Dieser stille Fehler waere der gefaehrlichste - deshalb hier laut.
      - name: Secret pruefen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Secret NTFY_TOPIC fehlt - es kaeme keine Meldung aufs Handy an."
            echo "Anlegen unter: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "NTFY_TOPIC ist gesetzt (${#NTFY_TOPIC} Zeichen)."

      # Auf Knopfdruck: beweist Zustellung bis aufs Handy, ohne auf ein
      # wirklich frei werdendes Kennzeichen warten zu muessen.
      - name: Test-Meldung schicken
        if: inputs.test_push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node watch.js --test-push

      # Der Abendlauf schickt zusaetzlich den Tagesbericht - der meldet sich
      # auch dann, wenn nichts passiert ist, damit stilles Versagen auffaellt.
      - name: Kennzeichen pruefen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ZEITPLAN: ${{ github.event.schedule }}
          BERICHT: ${{ inputs.digest }}
        run: |
          if [ "$ZEITPLAN" = "0 18 * * *" ] || [ "$BERICHT" = "true" ]; then
            echo "Lauf mit Tagesbericht"
            node watch.js --digest
          else
            node watch.js
          fi

      # Der Zustand muss zwischen den Laeufen erhalten bleiben - Runner sind
      # fluechtig. Ohne das gaebe es jedes Mal einen leeren Ausgangszustand
      # und damit nie eine Erkennung.
      #
      # Committet wird nur bei echter Aenderung. Der Zeitstempel liegt bewusst
      # in einer ignorierten Datei, sonst gaebe es bei ~20 Laeufen am Tag
      # ebenso viele leere Commits. Zusaetzlich alle 14 Tage ein Lebenszeichen:
      # GitHub schaltet geplante Workflows nach 60 Tagen ohne Repo-Aktivitaet ab.
      - name: Stand zurueckschreiben
        run: |
          git config user.name  "kennzeichen-waechter[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ als Ganzes: fehlende Dateien brechen nicht ab, und was in
          # .gitignore steht (Topic, Zeitstempel, Logs) bleibt draussen.
          git add data/

          letzter=$(git log -1 --format=%ct)
          alter_tage=$(( ( $(date +%s) - letzter ) / 86400 ))

          if ! git diff --staged --quiet; then
            git commit -m "Stand geaendert: $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
          elif [ "$alter_tage" -ge 14 ]; then
            git commit --allow-empty -m "Lebenszeichen: seit ${alter_tage} Tagen unveraendert [skip ci]"
          else
            echo "Keine Aenderung, letzter Commit vor ${alter_tage} Tagen - nichts zu tun."
            exit 0
          fi

          # Ein paralleler Lauf koennte inzwischen gepusht haben.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
